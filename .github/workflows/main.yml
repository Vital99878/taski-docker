# .github/workflows/main.yml
name: Main Taski workflow

on:
  push:
    branches:
      - main

jobs:
  tests:
    # Используем актуальный образ Ubuntu 26.04 (или ubuntu-latest)
    runs-on: ubuntu-26.04

    services:
      postgres:
        image: postgres:17
        # Указываем имя тестовой базы, имя и пароль пользователя в открытом виде,
        # ведь эта база будет работать только во время прогона тестов
        env:
          POSTGRES_USER: django_user
          POSTGRES_PASSWORD: django_password
          POSTGRES_DB: django_db
        ports:
          - 5432:5432
        # Эта конструкция описывает проверку готовности сервиса postgres
        # Если её не будет, то тесты могут запуститься раньше, чем сервер PostgreSQL
        # В результате тесты опять решат, что базы нет, — и упадут
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      # Актуальная версия checkout (работает на Node.js 24)
      - name: Check out code
        uses: actions/checkout@v6

      # Актуальная версия setup-python (работает на Node.js 24)
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      # Обновляем pip и ставим свежие версии линтеров без устаревших ограничений
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 flake8-isort

      # Запускаем проверку стиля кода в папке backend/
      - name: Test with flake8
        run: |
          python -m flake8 backend/
          cd backend/
          python manage.py test


